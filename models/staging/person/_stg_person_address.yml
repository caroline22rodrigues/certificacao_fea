sources:
  - name: person
    description: Esse schema armazena os dados cadastrais de pessoas, clientes, endereços e informações de contato da Adventure Works.
    catalog: fea_academy
    schema: adventure_works
    
    tables:
      - name: person_address
        description: Tabela fonte com os endereços cadastrados das entidades relacionadas à empresa.
        columns:
          - name: addressid
            description: Identificador único do endereço.
            data_tests:
              - unique
              - not_null
          - name: addressline1
            description: Primeira linha do endereço.
          - name: city
            description: Cidade do endereço.
          - name: stateprovinceid
            description: Identificador do estado ou província associado ao endereço.
          - name: postalcode
            description: Código postal do endereço.
          - name: modifieddate
            description: Data da última modificação do registro.