sources:
  - name: person
    description: Esse schema armazena os dados cadastrais de pessoas, clientes, endereços e informações de contato da Adventure Works.
    catalog: fea_academy
    schema: adventure_works
    
    tables:
      
      - name: person_emailaddress
        description: Tabela fonte com os endereços de e-mail associados às pessoas cadastradas.
        columns:
          - name: businessentityid
            description: Identificador da entidade de negócio associada ao e-mail.
            data_tests:
              - unique
              - not_null
          - name: emailaddressid
            description: Identificador único do e-mail.
          - name: emailaddress
            description: Endereço de e-mail cadastrado.
          - name: modifieddate
            description: Data da última modificação do registro.
