sources:
  - name: person
    description: Esse schema armazena os dados cadastrais de pessoas, clientes, endereços e informações de contato da Adventure Works.
    catalog: fea_academy
    schema: adventure_works
    
    tables:
      - name: person_countryregion
        description: Tabela fonte com os países e regiões utilizados para segmentação geográfica e endereçamento.
        columns:
          - name: countryregioncode
            description: Código do país ou região.
          - name: name
            description: Nome do país ou região.
          - name: modifieddate
            description: Data da última modificação do registro.
