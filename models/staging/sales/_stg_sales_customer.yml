sources:
  - name: sales
    description: Esse schema armazena os dados transacionais relacionados às vendas, clientes, pedidos comerciais e territórios de venda do Adventure Works.
    catalog: fea_academy
    schema: adventure_works

    tables:

      - name: sales_customer
        description: Tabela fonte com os dados cadastrais dos clientes da Adventure Works, permitindo análises comerciais e relacionamento com clientes.
        columns:
          - name: customerid
            description: Identificador único do cliente.
            data_tests:
              - unique
              - not_null
          - name: personid
            description: Identificador da pessoa física associada ao cliente.
          - name: storeid
            description: Identificador da loja associada ao cliente corporativo.
          - name: territoryid
            description: Identificador do território de vendas associado ao cliente.
          - name: modifieddate
            description: Data da última modificação do registro.
