sources:
  - name: sales
    description: Esse schema armazena os dados transacionais relacionados às vendas, clientes, pedidos comerciais e territórios de venda do Adventure Works.
    catalog: fea_academy
    schema: adventure_works

    tables:
      - name: sales_currency
        description: Tabela fonte com as moedas utilizadas nas transações comerciais internacionais.
        columns:
          - name: currencycode
            description: Código identificador da moeda.
            data_tests:
              - not_null
          - name: name
            description: Nome da moeda.
          - name: modifieddate
            description: Data da última modificação do registro.
