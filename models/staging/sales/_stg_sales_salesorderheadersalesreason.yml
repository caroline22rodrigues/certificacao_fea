sources:
  - name: sales
    description: Esse schema armazena os dados transacionais relacionados às vendas, clientes, pedidos comerciais e territórios de venda do Adventure Works.
    catalog: fea_academy
    schema: adventure_works

    tables:
      - name: sales_salesorderheadersalesreason
        description: Tabela fonte responsável pelo relacionamento entre pedidos de venda e motivos de venda, permitindo identificar os motivos associados a cada transação comercial.
        columns:
          - name: salesorderid
            description: Identificador do pedido de venda.
          - name: salesreasonid
            description: Identificador do motivo de venda associado ao pedido.
          - name: modifieddate
            description: Data da última modificação do registro.