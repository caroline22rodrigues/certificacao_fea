version: 2

sources:
  - name: sales
    description: Esse schema armazena os dados transacionais relacionados às vendas.
    catalog: fea_academy
    schema: adventure_works

    tables:
      - name: sales_creditcard
        description: Tabela de cartões de crédito do Adventure Works.

        columns:
          - name: creditcardid
            description: Identificador único do cartão.
            data_tests:
              - unique
              - not_null

          - name: cardtype
            description: Tipo do cartão.

          - name: modifieddate
            description: Data de modificação.