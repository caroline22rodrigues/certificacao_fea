sources:
  - name: sales
    description: Esse schema armazena os dados transacionais relacionados às vendas, clientes, pedidos comerciais e territórios de venda do Adventure Works.
    catalog: fea_academy
    schema: adventure_works

    tables:

      - name: sales_creditcard
        description: Tabela fonte com os cartões de crédito utilizados nas transações de venda.
        columns:
          - name: creditcardid
            description: Identificador único do cartão de crédito.
          - name: cardtype
            description: Tipo ou bandeira do cartão.
          - name: expmonth
            description: Mês de expiração do cartão.
          - name: expyear
            description: Ano de expiração do cartão.
          - name: modifieddate
            description: Data da última modificação do registro.
