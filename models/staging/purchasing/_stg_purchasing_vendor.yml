sources:
  - name: purchasing
    description: Esse schema armazena os dados transacionais das compras efetuadas no Adventure Works.
    catalog: fea_academy
    schema: adventure_works

    tables:
      - name: purchasing_vendor
        description: Tabela fonte com os dados de fornecedores provenientes do schema Purchasing, contendo informações cadastrais e atributos comerciais dos vendors utilizados nos processos de compra.
        columns:
          - name: businessentityid
            description: Identificador único do fornecedor.
            data_tests:
              - unique
              - not_null
          - name: accountnumber
            description: Número da conta do fornecedor.
          - name: name
            description: Nome do fornecedor.
          - name: creditrating
            description: Classificação de crédito do fornecedor.
          - name: preferredvendorstatus
            description: Indicador de fornecedor preferencial.
          - name: activeflag
            description: Indicador de fornecedor ativo.
          - name: purchasingwebserviceurl
            description: URL do serviço web utilizado para compras com o fornecedor.
          - name: modifieddate
            description: Data da última modificação do registro.
