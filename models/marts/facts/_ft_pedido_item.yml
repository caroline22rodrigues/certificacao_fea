
models:
  - name: ft_pedido_item
    description: Fato contendo os itens dos pedidos de venda e métricas financeiras associadas no nível do item do pedido.
    columns:
      - name: pk_pedido_item_id
        description: Identificador único do item do pedido.
        data_tests:
          - unique
          - not_null
      - name: pk_pedido_id
        description: Identificador do pedido associado ao item.
        data_tests:
          - not_null
      - name: fk_produto_id
        description: Identificador do produto vendido.
      - name: quantidade_pedida
        description: Quantidade de itens solicitados no pedido.
      - name: preco_unitario
        description: Valor unitário do produto vendido.
      - name: desconto_preco_unitario
        description: Percentual de desconto aplicado ao item do pedido.
      - name: valor_bruto
        description: Valor bruto do item calculado sem aplicação de desconto.
      - name: valor_liquido
        description: Valor líquido do item calculado após aplicação do desconto.
      - name: data_escrita_elt
        description: Data e hora de geração do registro durante o processo ELT.