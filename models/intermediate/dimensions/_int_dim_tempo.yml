
models:
  - name: int_dim_tempo
    description: Tabela intermediaria contendo as datas de 2000 até 2026
    columns:
      - name: pk_data
        description: Identificador único da data.
        data_tests:
              - unique
              - not_null
      - name: data
        description: Data no formato dd-mm-aaaa.
      - name: dia
        description: Exibe o dia.
      - name: mes
        description: Exibe o mês.
      - name: ano
        description: Exibe o ano.
      - name: dia_da_semana
        description: Exibe o número relacionado ao dia da semana.
      - name: is_final_de_semana
        description: Exibe true quandop for final de semana e false quando não for. 
      - name: data_escrita_elt
        description: Data de controle para auditoria, indica o momento em que a linha foi gerada na tabela.
