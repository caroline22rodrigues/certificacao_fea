models:
  - name: int_dim_fornecedor
    description: Tabela intermediaria contendo os dados cadastrais e comerciais dos fornecedores.
    columns:
      - name: pk_fornecedor_id
        description: Identificador único do fornecedor.
        data_tests:
              - unique
              - not_null
      - name: nome_fornecedor
        description: Nome do fornecedor.
      - name: ativo
        description: Indicador de fornecedor ativo.