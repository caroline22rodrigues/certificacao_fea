models:
  - name: int_dim_status_pedido
    description: Tabela intermediaria contendo os possíveis status dos pedidos de venda.
    columns:
      - name: pk_status_pedido_id
        description: Identificador único do status do pedido.
        data_tests:
              - unique
              - not_null
      - name: nome_status_pedido
        description: Descrição textual do status do pedido.
      - name: data_escrita_elt
        description: Data de controle para auditoria, indica o momento em que a linha foi gerada na tabela.