version: 2

models:
  - name: int_ft_pedido
    description: Fato no nível de pedido contendo métricas agregadas e dimensões relacionadas ao cabeçalho do pedido.
    data_tests:
      - total_vendas_ano:
          arguments:
            ano: 2011
            valor_esperado: 12646112.16

    columns:
      - name: pk_pedido_id
        description: Identificador único do pedido.
        data_tests:
          - unique
          - not_null

      - name: fk_cliente_id
        description: Identificador do cliente associado ao pedido.

      - name: fk_loja_id
        description: Identificador da loja associada ao cliente.

      - name: fk_vendedor_id
        description: Identificador do vendedor responsável pelo pedido.

      - name: fk_pagamento_id
        description: Identificador do cartão de crédito utilizado no pedido.

      - name: fk_territorio_id
        description: Identificador do território de vendas associado ao pedido.

      - name: fk_endereco_cobranca_id
        description: Identificador do endereço de cobrança do pedido.

      - name: fk_endereco_entrega_id
        description: Identificador do endereço de entrega do pedido.

      - name: fk_metodo_envio_id
        description: Identificador do método de envio utilizado.

      - name: fk_status_pedido_id
        description: Identificador do status do pedido.

      - name: pk_data_pedido
        description: Chave da dimensão de tempo referente à data do pedido.

      - name: valor_bruto_pedido
        description: Valor bruto total dos itens do pedido antes dos descontos.

      - name: valor_liquido_pedido
        description: Valor líquido total dos itens do pedido após descontos.

      - name: quantidade_itens
        description: Quantidade total de itens do pedido.

      - name: quantidade_produtos
        description: Quantidade distinta de produtos presentes no pedido.

      - name: valor_frete
        description: Valor do frete do pedido.

      - name: valor_imposto
        description: Valor total de impostos do pedido.

      - name: valor_total
        description: Valor total devido do pedido.

      - name: data_escrita_elt
        description: Data e hora de escrita do registro na camada analítica.