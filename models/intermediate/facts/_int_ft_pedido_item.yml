
models:
  - name: int_ft_pedido_item
    description: Fato contendo os itens dos pedidos de venda e métricas financeiras associadas.
    columns:
      - name: pk_pedido_id
        description: Identificador único do pedido de venda.
        data_tests:
              - not_null
      - name: pk_pedido_item_id
        description: Identificador único do item do pedido.
        data_tests:
              - unique
              - not_null
      - name: fk_cliente_id
        description: Identificador do cliente associado ao pedido.
      - name: fk_territorio_id
        description: Identificador do território de vendas.
      - name: fk_produto_id
        description: Identificador do produto vendido.
      - name: fk_metodo_envio_id
        description: Identificador do metodo de envio.
      - name: fk_status_pedido_id
        description: Identificador do status do pedido
      - name: fk_vendedor_id
        description: Identificador do vendedor
      - name: fk_endereco_cobranca_id
        description: Identificador do endereço de cobrança.
      - name: fk_endereco_entrega_id
        description: Identificador do endereço de entrega.
      - name: quantidade_pedida
        description: Quantidade de itens solicitados no pedido.
      - name: preco_unitario
        description: Valor unitário do produto vendido.
      - name: desconto_preco_unitario
        description: Percentual de desconto aplicado ao item.
      - name: valor_bruto
        description: Valor bruto calculado sem desconto.
      - name: valor_liquido
        description: Valor líquido calculado após desconto.
      - name: valor_frete
        description: Valor do frete associado ao pedido.
      - name: valor_imposto
        description: Valor de impostos associados ao pedido.
      - name: data_modificacao
        description: Data da última modificação do registro.